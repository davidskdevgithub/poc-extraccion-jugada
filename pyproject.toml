[project]
name = "jugadas-video"
version = "0.1.0"
description = "PoC: extracción de jugadas desde video para visualización 3D"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jugadas_video"]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
# Reglas básicas + orden de imports (stack.md §2)
select = ["E", "F", "I"]
